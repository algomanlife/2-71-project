# 2^71 project — CI quality gates
#
# IMPORTANT: these jobs run on CPU-only GitHub-hosted runners.
# A green build here means "compiles and CPU-side tests pass".
# It is NEVER a substitute for GPU validation (see
# docs/compatibility/CUDA13_BLACKWELL.md — verification status).
# GPU benchmarks run only on GPU-equipped runners (none configured yet).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  kernel-resource-matrix:
    name: Kernel resource matrix (compile-time evidence, no GPU execution)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.0.0-devel-ubuntu24.04
    steps:
      - name: Install make (retry-tolerant)
        run: |
          command -v make >/dev/null 2>&1 && exit 0
          for i in 1 2 3; do
            apt-get update -qq && break || { echo "apt update retry $i"; sleep 10; }
          done
          apt-get install -y -qq make > /dev/null
      - uses: actions/checkout@v4
      - name: Stack frame vs MAX_BATCH_SIZE (ptxas -v)
        run: |
          for MB in 128 256 512 1024; do
            echo "=== MAX_BATCH_SIZE=$MB ==="
            nvcc -O3 -rdc=true -use_fast_math --ptxas-options=-O3 \
                 -gencode arch=compute_120,code=sm_120 -std=c++17 \
                 -Xptxas -v -DMAX_BATCH_SIZE=$MB -c project_2_71.cu -o /dev/null 2>&1 \
                 | grep -E "Compiling entry|stack frame|spill (stores|loads)" || true
          done
      - name: SASS + PTX dump and local-memory census
        run: |
          make GPU_ARCH=120 SM_ARCHS="120"
          cuobjdump -sass ./project-2-71 > sass_sm120.txt
          cuobjdump -ptx  ./project-2-71 > ptx_sm120.txt
          echo "=== per-function local-memory instruction census (sm_120 SASS) ==="
          awk '
            /^Function :/ { fn=$3 }
            /LDL|STL/ {
              if (match($0, /LDL/))  ldl[fn]++
              if (match($0, /STL/))  stl[fn]++
            }
            END {
              for (f in ldl) printf "%s  LDL=%d STL=%d\n", f, ldl[f], stl[f]
              for (f in stl) if (!(f in ldl)) printf "%s  LDL=0 STL=%d\n", f, stl[f]
            }' sass_sm120.txt | sort
          echo "=== total SASS size: $(wc -l < sass_sm120.txt) lines"
      - name: Upload SASS/PTX evidence
        uses: actions/upload-artifact@v4
        with:
          name: sm120-sass-ptx
          path: |
            sass_sm120.txt
            ptx_sm120.txt
          retention-days: 90

  build-cuda13:
    name: Build (CUDA 13, sm_120 + legacy, CPU-only runner)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.0.0-devel-ubuntu24.04
    steps:
      - name: Install make (retry-tolerant)
        run: |
          command -v make >/dev/null 2>&1 && exit 0
          for i in 1 2 3; do
            apt-get update -qq && break || { echo "apt update retry $i"; sleep 10; }
          done
          apt-get install -y -qq make > /dev/null
      - uses: actions/checkout@v4
      - name: Build for sm_120 (Blackwell)
        run: make GPU_ARCH=120 SM_ARCHS="120"
      - name: Build legacy architectures (sm_75/86/89 + sm_120)
        run: |
          make clean
          make GPU_ARCH=120
      - name: Register/spill report (audit H2 evidence)
        run: make ptxas-info
      - name: Verify executable was produced
        run: test -x ./project-2-71
      - name: Upload solver binary (for argument-validation tests)
        uses: actions/upload-artifact@v4
        with:
          name: solver-binary
          path: project-2-71
          retention-days: 7

  python-tests:
    name: CPU reference tests + argument validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install ecdsa
      - name: Fetch solver binary (may not exist on transitional branches)
        id: fetch_bin
        uses: actions/download-artifact@v4
        with:
          name: solver-binary
        continue-on-error: true
      - name: Run CPU tests (GPU search tests must SKIP, not pass silently)
        run: |
          if [ ! -d tests ]; then
            echo "NOTE: no tests/ on this branch yet (transitional branch)"
            exit 0
          fi
          if [ -f project-2-71 ]; then
            chmod +x project-2-71
            # argument-validation tests exit before any CUDA call, so the
            # Linux x86_64 binary runs on this GPU-less runner.
            export PROJECT_2_71_BIN="$PWD/project-2-71"
          else
            echo "NOTE: no solver binary artifact; binary tests will skip"
          fi
          python3 -m unittest discover -s tests -v 2>&1 | tee unittest.log
          # unittest fails the step on FAIL/ERROR. Additionally, GPU search
          # tests must report skips here (CPU-only runner):
          if grep -E "test_readme_vector|test_range_matrix|test_grid_configurations|test_slice_configurations|test_both_parities|test_seeded_random|test_config_invariance|test_same_run_twice|test_no_match|test_found_exit" unittest.log \
             | grep -v "skipped" | grep -q .; then
            echo "ERROR: GPU search tests executed on a CPU-only runner"; exit 1
          fi

  python-hygiene:
    name: Python syntax + harness integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all python sources on this branch
        run: |
          shopt -s nullglob
          sources=(proof.py tests/*.py)
          if [ ${#sources[@]} -eq 0 ]; then echo "no python sources"; exit 0; fi
          python3 -m py_compile "${sources[@]}"
      - name: Bash syntax check
        run: |
          if [ -f benchmarks/baseline/run_baseline.sh ]; then
            bash -n benchmarks/baseline/run_baseline.sh
          fi

  repo-hygiene:
    name: Branding and documentation-link hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No obsolete branding in active code
        run: |
          # Old-brand mentions are allowed only in attribution docs
          # (README provenance lines, ATTRIBUTION.md) — never in code,
          # build files, scripts, or CI definitions.
          matches=$(grep -rniE "cyclone|dookoo" --exclude-dir=.github \
              --include="*.cu" --include="*.cuh" --include="*.h" \
              --include="*.py" --include="Makefile" \
              --include="*.yml" --include="*.sh" . || true)
          if [ -n "$matches" ]; then
            echo "Obsolete branding found in active files:"
            echo "$matches"
            exit 1
          fi
      - name: Markdown link targets exist (no broken doc references)
        run: |
          broken=0
          for md in $(find . -name "*.md" -not -path "./.git/*"); do
            for target in $(grep -oE "\]\(([^)#]+\.md)\)" "$md" | sed 's/^](//; s/)$//' | grep -v "^http" || true); do
              dir=$(dirname "$md")
              if [ ! -f "$dir/$target" ]; then
                echo "BROKEN: $md -> $target"
                broken=1
              fi
            done
          done
          [ "$broken" -eq 0 ] || exit 1
      - name: No fabricated benchmark rows in baseline docs
        run: |
          for f in docs/benchmarks/BASELINE_RESULTS.md docs/benchmarks/PERFORMANCE_HISTORY.md; do
            [ -f "$f" ] || continue
            if grep -qE "^\| [0-9a-f]{7,} \|" "$f"; then
              echo "ERROR: $f contains measured-looking rows without hardware-run records"
              exit 1
            fi
          done
