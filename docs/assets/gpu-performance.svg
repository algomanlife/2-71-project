<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="GPU performance cards: RTX 5090 vs RTX PRO 6000">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="accA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#3b7bff"/>
    </linearGradient>
    <linearGradient id="accB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5cf6"/>
      <stop offset="1" stop-color="#5c7bff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="240" rx="12" fill="url(#pbg)"/>

  <!-- Card 1: RTX 5090 -->
  <rect x="24" y="20" width="414" height="200" rx="10" fill="#101826" stroke="#1d2a3a"/>
  <rect x="24" y="20" width="414" height="4" rx="2" fill="url(#accA)"/>
  <text x="34" y="48" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial" font-size="16" font-weight="700" fill="#f2f7fb">NVIDIA GeForce RTX 5090</text>
  <text x="34" y="66" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8fa3b8">Blackwell · sm_120 · 170 SM · CUDA 13.4</text>
  <text x="34" y="112" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#00d4ff">8.133<tspan font-size="16" fill="#8fa3b8"> Gkeys/s</tspan></text>
  <text x="34" y="136" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="11" fill="#8fa3b8">Best observed — grid <tspan font-family="ui-monospace, Menlo, monospace" fill="#e8f1f8">512,64</tspan> · best observed, not sustained</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5b7391">
    <rect x="34" y="152" width="118" height="18" rx="9" fill="none" stroke="#1d2a3a"/>
    <text x="93" y="165" text-anchor="middle">baseline 7,800.4</text>
    <rect x="160" y="152" width="118" height="18" rx="9" fill="none" stroke="#1d2a3a"/>
    <text x="219" y="165" text-anchor="middle">12/12 grids</text>
    <rect x="286" y="152" width="118" height="18" rx="9" fill="none" stroke="#1d2a3a"/>
    <text x="345" y="165" text-anchor="middle">19/19 · 528/528</text>
  </g>
  <text x="34" y="196" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="9.5" fill="#5b7391">early-termination known-answer runs (2^33-key range) · 2026-11-05</text>

  <!-- Card 2: RTX PRO 6000 -->
  <rect x="462" y="20" width="414" height="200" rx="10" fill="#101826" stroke="#1d2a3a"/>
  <rect x="462" y="20" width="414" height="4" rx="2" fill="url(#accB)"/>
  <text x="472" y="48" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial" font-size="16" font-weight="700" fill="#f2f7fb">NVIDIA RTX PRO 6000 Blackwell WE</text>
  <text x="472" y="66" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8fa3b8">Blackwell · sm_120 · 188 SM · CUDA 13.4</text>
  <text x="472" y="112" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#8a5cf6">7.452<tspan font-size="16" fill="#8fa3b8"> Gkeys/s</tspan></text>
  <text x="472" y="136" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="11" fill="#8fa3b8">Best observed — grid <tspan font-family="ui-monospace, Menlo, monospace" fill="#e8f1f8">128,64</tspan> · best observed, not sustained</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5b7391">
    <rect x="472" y="152" width="118" height="18" rx="9" fill="none" stroke="#1d2a3a"/>
    <text x="531" y="165" text-anchor="middle">baseline 7,074.8</text>
    <rect x="598" y="152" width="118" height="18" rx="9" fill="none" stroke="#1d2a3a"/>
    <text x="657" y="165" text-anchor="middle">12/12 grids</text>
    <rect x="724" y="152" width="118" height="18" rx="9" fill="none" stroke="#1d2a3a"/>
    <text x="783" y="165" text-anchor="middle">grid sweep only</text>
  </g>
  <text x="472" y="196" font-family="ui-sans-serif, -apple-system, Segoe UI" font-size="9.5" fill="#5b7391">early-termination known-answer runs (2^33-key range) · 2026-11-05</text>
</svg>
