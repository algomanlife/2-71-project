<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Performance overview — status">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
  </defs>
  <rect width="880" height="330" rx="12" fill="url(#pbg)"/>
  <text x="440" y="36" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial" font-size="18" font-weight="700" fill="#f2f7fb">Performance Status</text>
  <text x="440" y="58" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5b7391">no measured results yet — records appear here after hardware benchmark runs</text>

  <!-- three status tiles -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <!-- compile evidence -->
    <rect x="60" y="90" width="230" height="180" rx="10" fill="#101826" stroke="#1d2a3a"/>
    <text x="175" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#00d4ff">COMPILE EVIDENCE</text>
    <text x="175" y="150" text-anchor="middle" font-size="11" fill="#8fa3b8">sm_120 SASS builds</text>
    <text x="175" y="170" text-anchor="middle" font-size="11" fill="#8fa3b8">CUDA 13.0 · CI-verified</text>
    <text x="175" y="200" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f1f8">16,688 B</text>
    <text x="175" y="222" text-anchor="middle" font-size="10" fill="#5b7391">kernel stack frame (B=1024)</text>
    <text x="175" y="244" text-anchor="middle" font-size="10" fill="#5b7391">251 static LDL/STL</text>
    <text x="175" y="258" text-anchor="middle" font-size="10" fill="#5b7391">see STACK_FRAME_INVESTIGATION</text>

    <!-- measured throughput -->
    <rect x="325" y="90" width="230" height="180" rx="10" fill="#101826" stroke="#7a3b3b"/>
    <text x="440" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#ff7b72">MEASURED THROUGHPUT</text>
    <text x="440" y="150" text-anchor="middle" font-size="11" fill="#8fa3b8">RTX 5090 / PRO 6000 runs</text>
    <text x="440" y="185" text-anchor="middle" font-size="26" font-weight="700" fill="#ff7b72">PENDING</text>
    <text x="440" y="212" text-anchor="middle" font-size="10" fill="#5b7391">awaiting hardware validation</text>
    <text x="440" y="232" text-anchor="middle" font-size="10" fill="#5b7391">benchmarks/baseline/</text>
    <text x="440" y="248" text-anchor="middle" font-size="10" fill="#5b7391">records → docs/benchmarks/data/</text>

    <!-- historical context -->
    <rect x="590" y="90" width="230" height="180" rx="10" fill="#101826" stroke="#1d2a3a"/>
    <text x="705" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5cf6">HISTORICAL (UPSTREAM)</text>
    <text x="705" y="150" text-anchor="middle" font-size="11" fill="#8fa3b8">CUDACyclone README</text>
    <text x="705" y="170" text-anchor="middle" font-size="11" fill="#8fa3b8">unverified · context only</text>
    <text x="705" y="200" text-anchor="middle" font-size="15" fill="#e8f1f8">RTX 5090 · 8.4 Gkeys/s*</text>
    <text x="705" y="222" text-anchor="middle" font-size="15" fill="#e8f1f8">RTX 4090 · 6.2 Gkeys/s*</text>
    <text x="705" y="246" text-anchor="middle" font-size="10" fill="#5b7391">*not measured by this project</text>
  </g>
  <text x="440" y="305" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5b7391">historical numbers are attribution context, never proof of this project's performance</text>
</svg>
